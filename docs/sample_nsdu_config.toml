[general]
user_agent = 'NationStates Dispatch Utility run by United States of Vietnam (watarichanno@gmail.com)'

# Path to directory containing source files of your own loaders
# custom_loader_dir_path = '~/my_nsdu_loaders'

[rendering]
complex_formatter_source_path = '/path/to/folder/tsp_dispatches/design/complex_bbc_formatters/complex_bbc_formatters.py'
filter_paths = ['/path/to/folder/tsp_dispatches/design/filters.py']

[plugins]
# Choose loader to load dispatch config and content.
dispatch_loader = 'google_dispatch_loader'
# Choose loader to load simple BBCode formatters
simple_bbc_loader = 'file_simple_bbc_loader'
# Choose loader to load template variables.
template_var_loader = ['file_template_var_loader']
# Choose loader to load nation login credentials.
cred_loader = 'json_cred_loader'

[loaders_config]
[loaders_config.file_dispatch_loader]
# dispatch_config_paths = ['~/ns_dispatches/dispatches.toml']
# dispatch_template_path = '~/ns_dispatches'

# Dispatch file extension
# file_ext = '.txt'

[loaders_config.file_simple_bbc_loader]
file_path = '/path/to/folder/tsp_dispatches/design/simple_bbc_formatters.toml'

[loaders_config.file_template_var_loader]
template_var_paths = ['/path/to/folder/tsp_dispatches/personnel.toml',
                      '/path/to/folder/tsp_dispatches/urls.toml',
                      '/path/to/folder/tsp_dispatches/img_urls.toml',
                      '/path/to/folder/tsp_dispatches/misc.toml']
# Variable groups that contain personnel names (e.g. government official names)
personnel_groups = ['gov_officials']
# Variable groups that define information associated with a personnel name (e.g. nation name, Discord ID)
people_info_groups = ['people_info']

[loaders_config.json_cred_loader]
# cred_path = '/path/to/folder/nation-creds.json'

[loaders_config.google_dispatch_loader]
google_cred_path = '/path/to/folder/nsdu_google_creds.json'
owner_nation_sheet = {spreadsheet_id = '1tdG_2Vp0VabvL9TGAaM5fX3vUrF-YLX8b851M1JgeJM', range='Owner nations!A3:C'}
category_setup_sheet = {spreadsheet_id = '1tdG_2Vp0VabvL9TGAaM5fX3vUrF-YLX8b851M1JgeJM', range='Categories!A3:C'}
