[project]
name = "ns-dispatch-utility"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "appdirs>=1.4.4",
    "bbcode>=1.1.0",
    "google-api-python-client>=2.177.0",
    "jinja2>=3.1.6",
    "nationstates>=3.1.4",
    "pluggy>=1.6.0",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.4",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "ruff>=0.12.7",
]

[project.scripts]
nsdu = "nsdu.__main__:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nsdu"
module-root = ""